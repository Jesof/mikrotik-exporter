name: Cleanup Caches

on:
  schedule:
    - cron: '0 0 * * 1'  # Запуск каждый понедельник в 00:00 UTC
  workflow_dispatch:  # Возможность ручного запуска

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cleanup all caches older than 7 days
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
            
            console.log(`Deleting caches older than: ${oneWeekAgo.toISOString()}`);
            
            // Получаем все кеши с обработкой пагинации
            let allCaches = [];
            let page = 1;
            let perPage = 100; // Максимальное количество элементов на странице
            let hasNext = true;
            
            while (hasNext) {
              console.log(`Fetching caches page ${page}...`);
              const response = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page: page
              });
              
              const caches = response.data.actions_caches;
              console.log(`Received ${caches.length} caches on page ${page}`);
              
              if (caches.length === 0) {
                hasNext = false;
              } else {
                allCaches = allCaches.concat(caches);
                page++;
              }
              
              // Ограничиваем количество страниц для предотвращения бесконечного цикла
              if (page > 100) {
                console.log("Reached maximum page limit, stopping pagination");
                break;
              }
            }
            
            console.log(`Total caches fetched: ${allCaches.length}`);
            
            let deletedCount = 0;
            
            for (const cache of allCaches) {
              const cacheCreated = new Date(cache.created_at);
              
              // Отладочная информация о каждом кеше
              console.log(`Cache: ${cache.key} created at ${cache.created_at} (${cacheCreated.toISOString()})`);
              
              // Удаление кешей, созданных более недели назад
              if (cacheCreated < oneWeekAgo) {
                console.log(`Deleting cache: ${cache.key} created at ${cache.created_at}`);
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  console.log(`Successfully deleted cache: ${cache.key}`);
                  deletedCount++;
                } catch (error) {
                  console.error(`Failed to delete cache: ${cache.key}`, error.message);
                }
              }
            }
            
            console.log(`Total caches deleted: ${deletedCount}`);