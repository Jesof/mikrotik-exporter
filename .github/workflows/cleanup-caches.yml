name: Cleanup Caches

on:
  schedule:
    - cron: '0 0 * * 1'  # Запуск каждый понедельник в 00:00 UTC
  workflow_dispatch:  # Возможность ручного запуска

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cleanup caches when total size exceeds 8GB
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Порог размера кеша (8 ГБ в байтах)
            const SIZE_THRESHOLD = 8 * 1024 * 1024 * 1024; // 8 ГБ
            
            console.log(`Size threshold: ${SIZE_THRESHOLD} bytes (${SIZE_THRESHOLD / (1024 * 1024 * 1024)} GB)`);
            
            // Получаем все кеши с обработкой пагинации
            let allCaches = [];
            let page = 1;
            let perPage = 100; // Максимальное количество элементов на странице
            let hasNext = true;
            
            while (hasNext) {
              console.log(`Fetching caches page ${page}...`);
              const response = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: perPage,
                page: page
              });
              
              const caches = response.data.actions_caches;
              console.log(`Received ${caches.length} caches on page ${page}`);
              
              if (caches.length === 0) {
                hasNext = false;
              } else {
                allCaches = allCaches.concat(caches);
                page++;
              }
              
              // Ограничиваем количество страниц для предотвращения бесконечного цикла
              if (page > 100) {
                console.log("Reached maximum page limit, stopping pagination");
                break;
              }
            }
            
            console.log(`Total caches fetched: ${allCaches.length}`);
            
            // Вычисляем общий размер кеша
            let totalSize = 0;
            for (const cache of allCaches) {
              totalSize += cache.size_in_bytes;
            }
            
            console.log(`Total cache size: ${totalSize} bytes (${(totalSize / (1024 * 1024 * 1024)).toFixed(2)} GB)`);
            
            // Если общий размер меньше порогового значения, ничего не удаляем
            if (totalSize <= SIZE_THRESHOLD) {
              console.log("Total cache size is below threshold, no caches will be deleted");
              console.log(`Total caches deleted: 0`);
              return;
            }
            
            // Сортируем кеши по дате создания (от самых старых к самым новым)
            allCaches.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            
            // Удаляем кеши, начиная с самых старых, пока общий размер не станет меньше порогового значения
            let deletedCount = 0;
            let freedSize = 0;
            
            for (const cache of allCaches) {
              // Проверяем, нужно ли еще удалять кеши
              if (totalSize - freedSize <= SIZE_THRESHOLD) {
                break;
              }
              
              console.log(`Deleting cache: ${cache.key} created at ${cache.created_at} (size: ${cache.size_in_bytes} bytes)`);
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                console.log(`Successfully deleted cache: ${cache.key}`);
                deletedCount++;
                freedSize += cache.size_in_bytes;
              } catch (error) {
                console.error(`Failed to delete cache: ${cache.key}`, error.message);
              }
            }
            
            console.log(`Total caches deleted: ${deletedCount}`);
            console.log(`Total size freed: ${freedSize} bytes (${(freedSize / (1024 * 1024 * 1024)).toFixed(2)} GB)`);
            console.log(`Remaining cache size: ${totalSize - freedSize} bytes (${((totalSize - freedSize) / (1024 * 1024 * 1024)).toFixed(2)} GB)`);