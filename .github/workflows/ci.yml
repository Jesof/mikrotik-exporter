name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate for a release
        type: string
        required: true

concurrency:
  group: rust-ci-${{ github.event_name }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Classify changed paths so a docs/CI-only change does not rebuild and retest
  # the whole Rust code base. Missing or unclassifiable paths are treated as Rust
  # changes (fail-safe): the heavy jobs then run and must succeed.
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      workflows: ${{ steps.classify.outputs.workflows }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          files=""
          case "$EVENT_NAME" in
            pull_request)
              git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
              files=$(git diff --name-only "origin/${BASE_REF}...HEAD") ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                files=$(git show --name-only --pretty=format: HEAD)
              else
                files=$(git diff --name-only "$BEFORE_SHA" HEAD)
              fi ;;
          esac
          # Paths that cannot affect the compiled Rust crate or its image.
          non_rust='(\.md$|^docs/|^grafana/|^k8s/|^\.github/|^LICENSE$|^NOTICE$|^\.gitignore$|^\.gitmessage$|^\.env\.example$|^\.dockerignore$|^\.cursorrules$)'
          if [[ -z "$files" ]]; then
            # Schedule, manual dispatch, or an undeterminable diff: full validation.
            rust=true; workflows=true; docker=true
          else
            rust=false
            if grep -vE "$non_rust" <<<"$files" | grep -q .; then rust=true; fi
            workflows=false
            if grep -qE '^\.github/(workflows|actions)/|^build-docker\.sh$' <<<"$files"; then workflows=true; fi
            docker=false
            if [[ "$rust" == "true" ]] || grep -qE '^(Dockerfile|build-docker\.sh|\.dockerignore)$|^\.github/workflows/docker-build\.yml$' <<<"$files"; then docker=true; fi
          fi
          echo "Changed paths:"
          printf '%s\n' "$files"
          echo "rust=$rust workflows=$workflows docker=$docker"
          {
            echo "rust=$rust"
            echo "workflows=$workflows"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"

  cargo-check:
    name: Cargo Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: check-1.98.0
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: cargo check --all-targets --all-features --locked
      - name: Require consistent compiler and MSRV pins
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import tomllib
          def load(path):
              return tomllib.loads(pathlib.Path(path).read_text())
          version = load("rust-toolchain.toml")["toolchain"]["channel"]
          assert version == "1.98.0", "Update the CI action pins with the toolchain"
          assert load("Cargo.toml")["package"]["rust-version"] == version
          assert load("clippy.toml")["msrv"] == version
          builder = re.search(r"^FROM rust:([0-9.]+)-", pathlib.Path("Dockerfile").read_text(), re.M)
          assert builder and builder[1] == version, "Docker compiler mismatch"
          PY

  # `Test Suite`, `Rustfmt`, `Clippy`, `Cargo Deny`, and `Security Audit` are required branch
  # checks, so their jobs must always report success. When no Rust path changed they skip the
  # heavy steps and succeed immediately; when Rust changed the heavy steps must run.
  test:
    name: Test Suite
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-1.98.0
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --all-features --locked
      - if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust-related paths changed; skipping test suite"

  fmt:
    name: Rustfmt
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: rustfmt
      - if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust-related paths changed; skipping rustfmt"

  clippy:
    name: Clippy
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: clippy-1.98.0
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust-related paths changed; skipping clippy"

  coverage:
    name: Code Coverage
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage-1.98.0-tarpaulin-0.37.2
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-tarpaulin@0.37.2
      - run: cargo tarpaulin --all-features --locked --out Xml --out Html --output-dir coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error
          retention-days: 7

  deny:
    name: Cargo Deny
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-deny@0.20.2
      - if: needs.changes.outputs.rust == 'true'
        run: cargo deny --locked check
      - if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust-related paths changed; skipping cargo-deny"

  security-audit:
    name: Security Audit
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-audit@0.22.2
      - if: needs.changes.outputs.rust == 'true'
        run: cargo audit
      - if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust-related paths changed; skipping security audit"

  workflow-lint:
    name: Workflow Validation
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Run actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: shellcheck build-docker.sh

  docker-validation:
    name: Docker Validation
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      platforms: linux/amd64,linux/arm64
      push: false
      cache_scope: validation-v2

  check:
    name: Check
    if: always()
    needs: [changes, cargo-check, test, fmt, clippy, coverage, deny, security-audit, workflow-lint, docker-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the relevant quality jobs to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUST: ${{ needs.changes.outputs.rust }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
          DOCKER: ${{ needs.changes.outputs.docker }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$RESULTS")
          [[ -z "$bad" ]] || fail "Failing or cancelled jobs: $bad"
          require() {
            result=$(jq -r --arg j "$1" '.[$j].result' <<< "$RESULTS")
            [[ "$result" == "success" ]] || fail "Required job '$1' result is '$result'"
          }
          require changes
          if [[ "$RUST" == "true" ]]; then
            for job in cargo-check test fmt clippy coverage deny security-audit; do require "$job"; done
          fi
          if [[ "$WORKFLOWS" == "true" ]]; then require workflow-lint; fi
          if [[ "$DOCKER" == "true" ]]; then require docker-validation; fi
          echo "Quality gate passed (rust=$RUST workflows=$WORKFLOWS docker=$DOCKER)"

  docker-publish:
    name: Publish main image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.source_sha == ''
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      source_sha: ${{ github.sha }}
      platforms: linux/amd64,linux/arm64
      push: true
      cache_scope: publication-v2
