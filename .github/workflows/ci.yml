name: Rust CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deny.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deny.toml'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - '.github/workflows/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force run all jobs'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      src: ${{ steps.filter.outputs.src }}
      tests: ${{ steps.filter.outputs.tests }}
      cargo: ${{ steps.filter.outputs.cargo }}
      docker: ${{ steps.filter.outputs.docker }}
      rust_files: ${{ steps.filter.outputs.rust_files }}
      deny_config: ${{ steps.filter.outputs.deny_config }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
            tests:
              - 'tests/**'
            cargo:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
            rust_files:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'clippy.toml'
            deny_config:
              - 'deny.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'

  check:
    name: Check
    needs: [changes]
    if: needs.changes.outputs.rust_files == 'true' || inputs.force_all == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --locked

  test:
    name: Test Suite
    needs: [changes]
    if: needs.changes.outputs.rust_files == 'true' || inputs.force_all == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  fmt:
    name: Rustfmt
    needs: [changes]
    if: needs.changes.outputs.rust_files == 'true' || inputs.force_all == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes]
    if: needs.changes.outputs.rust_files == 'true' || inputs.force_all == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --locked -- -D warnings

  coverage:
    name: Code Coverage
    needs: [changes]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.cargo == 'true' || inputs.force_all == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache cargo-tarpaulin
        id: cache-tarpaulin
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-cargo-tarpaulin
      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --out Xml --out Html --output-dir coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: ./coverage
          if-no-files-found: error

  deny:
    name: Cargo Deny
    needs: [changes]
    if: needs.changes.outputs.cargo == 'true' || needs.changes.outputs.deny_config == 'true' || inputs.force_all == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny
      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  docker-build:
    name: Docker Build and Push
    needs: [changes, check, test, fmt, clippy, coverage, deny, security-audit]
    if: >-
      always() &&
      !failure() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.rust_files == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      inputs.force_all == true) &&
      (github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-build.yml
    with:
      platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
      push: ${{ github.event_name != 'pull_request' }}
      cache_scope: ${{ github.ref_name }}
    secrets: inherit
