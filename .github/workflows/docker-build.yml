name: Docker Build and Push

on:
  workflow_call:
    inputs:
      platforms:
        description: Docker platforms to build
        type: string
        required: true
      push:
        description: Whether to push to registry
        type: boolean
        required: true
      cache_scope:
        description: Cache scope for GHA cache
        type: string
        required: true
  workflow_dispatch:
    inputs:
      platforms:
        description: Docker platforms to build
        type: string
        required: true
        default: linux/amd64,linux/arm64
      push:
        description: Whether to push to registry
        type: boolean
        required: true
        default: false
      cache_scope:
        description: Cache scope for GHA cache
        type: string
        required: true
        default: manual

concurrency:
  group: docker-build-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      base_tags: ${{ steps.tags.outputs.base_tags }}
      arm64_tags: ${{ steps.tags.outputs.arm64_tags }}
      amd64_tags: ${{ steps.tags.outputs.amd64_tags }}
      should_push: ${{ inputs.push }}
      build_multiarch: ${{ steps.check.outputs.build_multiarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check if multi-arch build
        id: check
        run: |
          if [[ "${{ inputs.platforms }}" == *"linux/arm64"* && "${{ inputs.platforms }}" == *"linux/amd64"* ]]; then
            echo "build_multiarch=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_multiarch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare arch tags
        id: tags
        if: inputs.push && steps.check.outputs.build_multiarch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_tags="${{ steps.meta.outputs.tags }}"
          arm64_tags=""
          amd64_tags=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            arm64_tags+="${tag}-arm64"$'\n'
            amd64_tags+="${tag}-amd64"$'\n'
          done <<< "$base_tags"
          {
            echo "base_tags<<EOF"
            echo "$base_tags"
            echo "EOF"
            echo "arm64_tags<<EOF"
            echo "$arm64_tags"
            echo "EOF"
            echo "amd64_tags<<EOF"
            echo "$amd64_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    if: contains(inputs.platforms, 'linux/amd64')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (amd64, no push)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ needs.prepare.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ inputs.cache_scope }}-amd64
            type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-amd64

      - name: Build Docker image (amd64, push)
        id: build
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ needs.prepare.outputs.build_multiarch == 'true' && needs.prepare.outputs.amd64_tags || needs.prepare.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ inputs.cache_scope }}-amd64
            type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-amd64

  build-arm64:
    needs: prepare
    if: contains(inputs.platforms, 'linux/arm64')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (arm64, no push)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: ${{ needs.prepare.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ inputs.cache_scope }}-arm64
            type=gha,scope=main-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-arm64

      - name: Build Docker image (arm64, push)
        id: build
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.build_multiarch == 'true' && needs.prepare.outputs.arm64_tags || needs.prepare.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ inputs.cache_scope }}-arm64
            type=gha,scope=main-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-arm64

  manifest:
    needs: [prepare, build-amd64, build-arm64]
    if: inputs.push && needs.prepare.outputs.build_multiarch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.create-manifest.outputs.digest }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: create-manifest
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max_attempts=5
            local delay=2
            while true; do
              "$@" && return 0
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }
          first_tag=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ -z "$first_tag" ]; then
              first_tag="$tag"
            fi
            retry docker buildx imagetools create \
              -t "$tag" \
              "${tag}-arm64" \
              "${tag}-amd64"
          done <<< "${{ needs.prepare.outputs.base_tags }}"
          inspect_output=$(retry docker buildx imagetools inspect "$first_tag")
          digest=$(printf '%s\n' "$inspect_output" | awk '/^Digest: /{print $2; exit}')
          if [ -z "$digest" ]; then
            echo "Digest not found in imagetools inspect output" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  attest:
    needs: [prepare, build-amd64, build-arm64, manifest]
    if: inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine digest
        id: digest
        run: |
          if [[ "${{ needs.prepare.outputs.build_multiarch }}" == "true" ]]; then
            echo "value=${{ needs.manifest.outputs.digest }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.platforms }}" == *"linux/arm64"* ]]; then
            echo "value=${{ needs.build-arm64.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ needs.build-amd64.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
