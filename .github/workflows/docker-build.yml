name: Docker Build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit
        type: string
        required: true
      platforms:
        type: string
        required: true
      push:
        type: boolean
        required: true
      cache_scope:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to validate (manual runs never publish)
        type: choice
        options: [linux/amd64, linux/arm64, 'linux/amd64,linux/arm64']
        default: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      image: ${{ steps.prepare.outputs.image }}
    steps:
      - id: prepare
        env:
          PLATFORMS: ${{ inputs.platforms }}
          REPOSITORY: ${{ github.repository }}
          PUSH: ${{ inputs.push }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64) ;;
            *) exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$PUSH" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || -n "$RELEASE_TAG" ]]
          fi
          matrix=$(jq -cn --arg platforms "$PLATFORMS" '{include: ($platforms | split(",") | map({platform: ., arch: split("/")[1], runner: (if . == "linux/arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)}))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0
      - name: Build and load for validation
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: mikrotik-exporter:validation
          cache-from: type=gha,scope=${{ inputs.cache_scope || 'manual-v2' }}-${{ matrix.arch }}-rust-1.98.0
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope || 'manual-v2' }}-${{ matrix.arch }}-rust-1.98.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false
      - name: Scan image before publication
        if: ${{ !inputs.push }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 mikrotik-exporter:validation
      - name: Verify unprivileged image configuration
        if: ${{ !inputs.push }}
        run: |
          test "$(docker inspect --format '{{.Config.User}}' mikrotik-exporter:validation)" = '1000:1000'
          docker run --rm --entrypoint /bin/sh mikrotik-exporter:validation -c 'test -x /app/mikrotik-exporter'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push validated build by digest
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.cache_scope || 'manual-v2' }}-${{ matrix.arch }}-rust-1.98.0
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope || 'manual-v2' }}-${{ matrix.arch }}-rust-1.98.0
          provenance: mode=max
      - name: Scan published image by digest
        if: inputs.push
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE@$DIGEST"
      - name: Verify published image configuration
        if: inputs.push
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE@$DIGEST")" = '1000:1000'
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -c 'test -x /app/mikrotik-exporter'
      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.push
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    if: inputs.push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest from immutable digests
        id: manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          sources=()
          for file in "$RUNNER_TEMP"/digests/*; do
            digest=${file##*/}
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          expected=1
          [[ "$PLATFORMS" != *,* ]] || expected=2
          [[ ${#sources[@]} -eq "$expected" ]]
          tags=(--tag "$IMAGE:sha-$SOURCE_SHA")
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            version=${RELEASE_TAG#v}
            minor=${version%.*}
            major=${version%%.*}
            tags+=(
              --tag "$IMAGE:$RELEASE_TAG"
              --tag "$IMAGE:$version"
              --tag "$IMAGE:$minor"
              --tag "$IMAGE:$major"
            )
          else
            [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]
            tags+=(--tag "$IMAGE:main" --tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest published single- or multi-platform manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
